name: Synth UI and preset tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and UI dependencies
        run: python -m pip install -e '.[ui]'
      - name: Test preset model and scroll-free Qt layout
        run: python -m unittest discover -s tests -v
